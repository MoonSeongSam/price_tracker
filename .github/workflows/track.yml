name: price-track

on:
  schedule:
    - cron: "23 * * * *"   # 매시 23분 (정각은 GitHub가 붐벼서 피함)
  workflow_dispatch:        # GitHub 앱에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: price-track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 가격 조회·알림
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          QUEUE_KEY: ${{ secrets.QUEUE_KEY }}
        # 버튼 메뉴가 깨운 실행(workflow_dispatch)은 요청만 빨리 처리
        run: python3 tracker.py ${{ github.event_name == 'workflow_dispatch' && '--queue-only' || '' }}

      - name: 기록 저장
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add state data
          git diff --cached --quiet || git commit -m "가격 기록 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 3; done
